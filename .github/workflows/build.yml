name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'

    - name: Accept Android SDK Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Prepare Missing Project Files & Catalog
      run: |
        # 1. Root settings.gradle.kts
        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "OrionPDF"
        include(":app")
        EOF

        # 2. Root empty build.gradle.kts
        touch build.gradle.kts

        # 3. Environment files and debug keystore expected by app/build.gradle.kts
        touch .env .env.example
        if [ ! -f "debug.keystore" ]; then
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

        # 4. Generate gradle/libs.versions.toml matching app dependencies
        mkdir -p gradle
        cat << 'EOF' > gradle/libs.versions.toml
        [versions]
        agp = "8.7.0"
        kotlin = "2.0.21"
        ksp = "2.0.21-1.0.27"
        secrets = "2.0.1"
        googleServices = "4.4.2"
        composeBom = "2024.10.01"
        firebaseBom = "33.5.1"
        coreKtx = "1.15.0"
        lifecycle = "2.8.7"
        activityCompose = "1.9.3"
        room = "2.6.1"
        coroutines = "1.9.0"
        junit = "4.13.2"
        junitVersion = "1.2.1"
        espressoCore = "3.6.1"
        testCore = "1.6.1"
        runner = "1.6.2"
        robolectric = "4.14"

        [libraries]
        androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
        androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
        androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
        androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
        androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
        androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
        androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
        androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
        androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
        androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
        androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
        androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
        androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
        androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
        androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
        androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
        androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
        androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
        firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
        kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
        kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
        kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
        junit = { group = "junit", name = "junit", version.ref = "junit" }
        androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
        androidx-core = { group = "androidx.test", name = "core", version.ref = "testCore" }
        androidx-runner = { group = "androidx.test", name = "runner", version.ref = "runner" }
        androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
        robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

        [plugins]
        android-application = { id = "com.android.application", version.ref = "agp" }
        kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
        google-devtools-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
        secrets = { id = "com.google.android.libraries.mapsplatform.secrets-gradle-plugin", version.ref = "secrets" }
        google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
        EOF

        # 5. Generate missing XML and style resources required by AndroidManifest.xml
        mkdir -p app/src/main/res/xml
        mkdir -p app/src/main/res/values

        cat << 'EOF' > app/src/main/res/xml/data_extraction_rules.xml
        <?xml version="1.0" encoding="utf-8"?>
        <data-extraction-rules>
            <cloud-backup><include domain="sharedpref" path="."/></cloud-backup>
        </data-extraction-rules>
        EOF

        cat << 'EOF' > app/src/main/res/xml/backup_rules.xml
        <?xml version="1.0" encoding="utf-8"?>
        <full-backup-content>
            <include domain="sharedpref" path="."/>
        </full-backup-content>
        EOF

        cat << 'EOF' > app/src/main/res/values/themes.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="Theme.MyApplication" parent="android:Theme.Material.Light.NoActionBar" />
        </resources>
        EOF

    - name: Build Debug APK
      run: gradle :app:assembleDebug -x test -x lint

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Orion-PDF-Reader-APK
        path: app/build/outputs/apk/debug/*.apk
        
